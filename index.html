<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Passage Rx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: clinical, exact, calm — a tool a clinic trusts with a patient's money
   IDEA: the pharmacy adjudication receipt — the answer printed line by line, stamped with who verified it
   PICTURE: the receipt itself, patient-pays figure on a yellow slab, progress rail above it
   COLOUR and TYPE: white, ink #101418, slate; yellow #ffd84a only behind the patient-pays figure; Manrope
   LAYOUT: numbered intake steps left, receipt right; stacks intake → receipt below 980px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#eef1f4);--mute:light-dark(#5a6672,#9aa6b2);--line:light-dark(#e3e7eb,#2a323b);--panel:light-dark(#f5f7f9,#171d23);--y:#ffd84a;--ok:light-dark(#1f6b45,#6fd3a0);--okbg:light-dark(#e8f5ee,#12291e);--warn:light-dark(#8a4b00,#ffc27a);--warnbg:light-dark(#fff3e0,#2b2010);--bad:light-dark(#a3261b,#ff8f84);--badbg:light-dark(#fdecea,#2e1614);--acc:light-dark(#2f5bd3,#8fb0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--panel);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;padding:12px max(4vw,16px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center}
.brand small{color:var(--mute);font-weight:500;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);padding:4px;border-radius:10px}
button,select,input{font:inherit;font-size:16px;color:inherit}
.tab{min-height:40px;padding:0 14px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mute)}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:700}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.demo{color:var(--mute);font-size:13px;padding:8px max(4vw,16px);text-align:center}
main{max-width:1280px;margin:0 auto;padding:8px max(4vw,16px) 64px}
.grid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
h1{font-size:clamp(28px,4vw,38px);line-height:1.05;margin:10px 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}h3{font-size:15px;margin:20px 0 8px}
.sn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:800;flex:none}
.sn.ok{background:var(--ok);color:var(--bg)}
.sub{color:var(--mute);margin:0 0 20px;max-width:72ch}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.step{display:flex;justify-content:space-between;align-items:center;gap:8px}
.done{font-size:13px;font-weight:700;color:var(--ok)}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
select,input[type=number],input[type=text]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input[type=text]{text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:13px;color:var(--mute);margin-top:4px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(max-width:460px){.pick{grid-template-columns:minmax(0,1fr)}}
.pt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;min-height:56px}
.pt[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.av{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
.av.d{background:var(--warnbg);color:var(--warn)}
.pt .av{display:grid}.pt b{display:block;font-size:14px;line-height:1.3}.pt span{font-size:12.5px;color:var(--mute);line-height:1.3;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--panel)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.sw:first-of-type{border-top:0}
.sw input{appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .2s}
.sw input:checked{background:var(--ok)}.sw input:checked::after{left:21px}
.sw input:disabled{opacity:.4}
.sw b{display:block;font-size:14.5px}.sw small{display:block;color:var(--mute);font-size:13px;line-height:1.4}
details.more summary{cursor:pointer;font-weight:700;font-size:14px;min-height:44px;display:flex;align-items:center;color:var(--acc)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);padding:4px;border-radius:12px}
.seg button{min-height:42px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--mute);cursor:pointer;font-size:15px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dose{margin-top:10px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:14px}
.dose b{display:block;font-size:12.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.dose .hint{margin-top:6px}
.srch{display:grid;grid-template-columns:minmax(0,1fr) 108px 88px;gap:8px;align-items:end}
@media(max-width:420px){.srch{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.srch .btn{grid-column:1/-1}}
.srch label.f{margin-top:0}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fl label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;min-height:36px}
.fl input{accent-color:var(--ink);width:16px;height:16px;margin:0}
.phl{display:grid;gap:8px;margin-top:12px;max-height:440px;overflow:auto;padding-right:2px}
.ph{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.ph[aria-current=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ph .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.ph .top b{font-size:14.5px}
.km{font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.ph .meta{font-size:12.5px;color:var(--mute)}
.bdg{display:flex;flex-wrap:wrap;gap:4px}
.bd{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--panel)}
.bd.p{background:var(--okbg);color:var(--ok)}.bd.w{background:var(--warnbg);color:var(--warn)}
.ph .btn{min-height:38px;font-size:14px;justify-self:start;padding:0 14px}
.note{font-size:13px;border-radius:10px;padding:8px 10px;margin-top:10px}
.note.w{background:var(--warnbg);color:var(--warn)}.note.m{background:var(--panel);color:var(--mute)}.note.b{background:var(--badbg);color:var(--bad)}
.selph{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.selph b{display:block}.selph small{color:var(--mute);font-size:12.5px}
.rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.rs{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.rs b{display:block;font-size:14px}
.rs.on{border-color:var(--ok);background:var(--okbg)}.rs.run{border-color:var(--acc)}.rs.no{border-style:dashed;color:var(--mute)}
@media(max-width:520px){.rail{grid-template-columns:minmax(0,1fr)}}
.stale{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
.rcpt{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -30px rgba(0,0,0,.5)}
.rh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:16px 20px;border-bottom:1px dashed var(--line)}
.rh b{font-size:17px}.rh span{color:var(--mute);font-size:14px}
.rb{padding:20px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
@media(max-width:620px){.hero{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--y);color:#101418;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.fig .l{font-size:14px;font-weight:700}
.fig .n{font-size:clamp(34px,5.5vw,50px);font-weight:800;line-height:1.05;white-space:nowrap;margin:4px 0}
.fig .s{font-size:13px;font-weight:600}
.fig .n.rg{font-size:clamp(24px,3.2vw,34px);white-space:normal}
.fig.grey{background:var(--panel);color:var(--ink)}
.status{border-radius:14px;padding:14px 16px;font-size:14.5px}
.status b{display:block;font-size:16px;margin-bottom:2px}
.st-ok{background:var(--okbg);color:var(--ok)}.st-warn{background:var(--warnbg);color:var(--warn)}.st-bad{background:var(--badbg);color:var(--bad)}.st-mute{background:var(--panel);color:var(--mute)}
.status p{margin:4px 0 0;color:var(--ink)}
.yrs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.yr{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.yr span{display:block;font-size:13px;color:var(--mute);font-weight:600}.yr b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.yr small{font-size:12.5px;color:var(--mute)}
@media(max-width:520px){.yrs{grid-template-columns:minmax(0,1fr)}}
.lines{margin:18px 0 0;border-top:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.ln span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.ln.tot{font-weight:800;font-size:16px;border-bottom:2px solid var(--ink)}
.ln.sub2{color:var(--mute);font-size:14px;padding-left:14px}
.acts{display:grid;gap:8px;margin-top:4px}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--panel);border-radius:10px;font-size:14.5px}
.act i{font-style:normal;font-weight:800;color:var(--acc)}
.pkt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
.pkt h4{margin:0 0 6px;font-size:14px}
.check{margin:0;padding:0}.check li{list-style:none;position:relative;padding-left:24px;margin:5px 0;font-size:14.5px}.check li::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;border:1.5px solid var(--mute);border-radius:4px}
.tog{display:inline-flex;gap:4px;background:var(--panel);padding:3px;border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.tog button{min-height:36px;border:0;border-radius:8px;background:transparent;font-weight:700;font-size:13.5px;color:var(--mute);cursor:pointer;padding:0 12px}
.tog button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.sel td{background:var(--panel);font-weight:700}
.tagl{font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.cls{font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;white-space:nowrap}
.why{display:block;font-size:12px;color:var(--mute);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.scroll{overflow-x:auto}
pre{background:var(--panel);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.45;overflow-x:auto;max-height:420px}
.disc{font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:18px;padding-top:12px}
.pulse{animation:p 1.1s ease-in-out infinite}@keyframes p{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.sw input,.sw input::after{transition:none}}
.empty{color:var(--mute);padding:48px 24px;text-align:center;border:1px dashed var(--line);border-radius:16px;background:var(--bg)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.phone{max-width:420px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:28px;padding:22px 18px;box-shadow:0 20px 50px -30px rgba(0,0,0,.5)}
.bubble{background:var(--panel);border-radius:16px 16px 16px 4px;padding:14px 16px;margin:10px 0;font-size:15.5px}
.bubble .who{font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
.bubble .amt{font-size:34px;font-weight:800;background:var(--y);color:#101418;display:inline-block;padding:2px 10px;border-radius:8px;margin:6px 0;white-space:nowrap}
@media(max-width:640px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;text-align:right}.stack td:first-child{text-align:left}.stack td::before{content:attr(data-l);color:var(--mute);font-weight:600;text-align:left}}
</style>
</head>

function apply(pl,amt,a){
 if(pl.kind==='odb'){const dr=Math.max(0,RULES.odb.deductible-a.dedPaid);const d=Math.min(amt,dr);const cp=Math.min(amt-d,RULES.odb.copay);
  return{plan:r2(amt-d-cp),pat:r2(d+cp),ded:r2(d),copay:r2(cp),coins:0,over:0,cap:0,dedLeft:r2(dr-d),maxLeft:null};}
 if(pl.kind==='ramq'){const R=RULES.ramq;const dr=Math.max(0,R.monthDed-Math.min(a.monthPaid,R.monthDed));const d=Math.min(amt,dr);const co=(amt-d)*R.coins;let pat=d+co,cap=0;
  const cl=Math.max(0,Math.min(R.monthMax-a.monthPaid,R.yearMax-a.qcPaid));if(pat>cl){cap=pat-cl;pat=cl;}
  return{plan:r2(amt-pat),pat:r2(pat),ded:r2(d),copay:0,coins:r2(co),over:0,cap:r2(cap),dedLeft:null,maxLeft:null};}
 const dr=Math.max(0,(pl.ded||0)-a.dedPaid);const d=Math.min(amt,dr);const rest=amt-d;const co=rest*(1-pl.coins);let plan=rest*pl.coins,over=0,cap=0,maxLeft=null;
 if(pl.max){const ml=Math.max(0,pl.max-a.maxUsed);if(plan>ml){over=plan-ml;plan=ml;}maxLeft=r2(ml-plan);}
 let pat=d+co+over;if(pl.qcCap!=null){const cl=Math.max(0,pl.qcCap-a.qcPaid);if(pat>cl){cap=pat-cl;pat=cl;plan+=cap;}}
 return{plan:r2(plan),pat:r2(pat),ded:r2(d),copay:0,coins:r2(co),over:r2(over),cap:r2(cap),dedLeft:r2(dr-d),maxLeft};}
function adjud(pt,c,qty,accs){const drug=r2(c.prod.price*qty),fee=RULES.dispFee,total=r2(drug+fee);const steps=[];let rem=total;
 pt.plans.forEach((pl,i)=>{const v=cover(pl,c);if(v.st==='not_covered'){steps.push({pl,i,skip:true,why:v.why});return;}const x=apply(pl,rem,accs[i]);steps.push({pl,i,...x});rem=x.pat;});
 return{drug,fee,total,steps,pat:r2(rem),plan:r2(total-rem)};}
const accOf=(pt,b)=>pt.plans.map(()=>({dedPaid:b.dedPaid||0,maxUsed:b.maxUsed||0,qcPaid:b.qcPaid||0,monthPaid:b.monthPaid||0}));
function bump(accs,a){a.steps.forEach(s=>{if(s.skip)return;const x=accs[s.i];x.dedPaid+=s.ded;x.maxUsed+=s.plan;x.qcPaid+=s.pat;x.monthPaid+=s.pat;});}

 fl.forEach(u=>{accs.forEach(x=>x.monthPaid=0);const a=adjud(pt,c,u,accs);bump(accs,a);pat+=a.pat;plan+=a.plan;total+=a.total;units+=u;});

function estimate(pt,c,qty){const y=Y();const b={dedPaid:num(y.dedPaid),maxUsed:num(y.maxUsed),qcPaid:num(y.qcPaid),monthPaid:num(y.monthPaid)};

 const cv=pt.plans.map(p=>cover(p,c)),why=cv.map(v=>v.why);
 if(cv.every(v=>v.st==='not_covered')){const tot=r2(c.prod.price*qty+RULES.dispFee);return{status:'not_covered',low:tot,exp:tot,high:tot,payer:0,exact:true,missing:[],total:tot,why,auth:[],assumptions:assume(pt,c,qty,[])};}

 <td data-l="${t('cov')}"><span class="dot" style="background:var(${a.e.status==='not_covered'?'--bad':a.e.status==='unknown'?'--mute':'--warn'})"></span>${covCell(a.e)}</td>
 <td class="num" data-l="${t('perfill')}">${a.e.exp==null?'—':rng(a.e)}</td><td class="num" data-l="${t('y1')}">${a.y1?money(a.y1.pat):'—'}</td><td class="num" data-l="${t('y2')}">${a.y2?money(a.y2.pat):'—'}</td></tr>`).join('')}</tbody></table></div>
 <p class="hint">${t('cmpn')}</p>
 ${e.assumptions?`<details class="more"><summary>${t('how')}</summary><ul style="margin:0;padding-left:18px;font-size:14px;color:var(--mute)">${e.assumptions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></details>`:''}
 <details class="more"><summary>${t('json')}</summary><p><button class="btn" id="cp" type="button">${t('copy')}</button></p><pre id="js">${esc(JSON.stringify(o,null,2))}</pre></details>
 <div class="disc">${o.disclaimer}<br>${t('disc_rel')}</div></div></div>`;}

function vPatient(){const o=out();if(!o)return`<h1>${t('patient')}</h1><div class="empty"><b>${t('none')}</b>${t('none2')}</div>`;
 const fr=FR(),lv=o.live_check,e=o.estimate,y1=o.annual_projection.year1,sp=o.selected_pharmacy;let msg;
 if(lv.performed&&lv.result==='covered')msg=`${fr?`Bonne nouvelle : votre régime couvre ${o.drug.name}. Votre pharmacie l’a vérifié. Vous paierez`:`Good news: your plan covers ${o.drug.name}, and your pharmacy has checked it. You’ll pay`}<br><span class="amt">${money(lv.patient_share)}</span><br>${fr?`Votre régime paie ${money(lv.payer_share)}.`:`Your plan pays ${money(lv.payer_share)}.`}`;
 else if(lv.performed&&lv.rejection_code==='PA')msg=`${fr?`Votre régime couvrira ${o.drug.name} une fois l’autorisation obtenue par votre médecin. Selon la pharmacie, vous paierez alors`:`Your plan will cover ${o.drug.name} once your doctor gets it authorized. The pharmacy calculated that you’ll then pay`}<br><span class="amt">${money(lv.projected_after_approval.patient_pays)}</span><br>${fr?'Votre clinique prépare la demande.':'Your clinic is preparing the request.'}`;
 else if(lv.performed)msg=(fr?'Votre pharmacie a reçu une réponse de votre régime qu’elle doit vérifier : ':'Your pharmacy got a response from your plan that it needs to look into: ')+esc(codeText(lv.rejection_code))+'.';
 else if(o.coverage_status==='unknown')msg=fr?'Nous ne pouvons pas encore confirmer votre couverture, et nous ne ferons pas de supposition. La clinique doit d’abord ajouter votre régime.':'We can’t confirm your coverage yet, and we won’t guess. The clinic needs to add your plan first.';
 else if(o.coverage_status==='not_covered')msg=fr?`Votre régime ne couvre pas ${o.drug.name} pour vous. Votre prescripteur peut examiner des options couvertes.`:`Your plan doesn’t cover ${o.drug.name} for you. Your prescriber can review covered options.`;
 else msg=`${fr?'Selon une estimation (pas encore vérifiée par la pharmacie), vous paierez':'Based on an estimate (not yet checked by the pharmacy), you’ll pay'}<br><span class="amt">${e.exact||e.patient_cost_low===e.patient_cost_high?money(e.patient_cost_expected):money(e.patient_cost_low)+' – '+money(e.patient_cost_high)}</span>`;
 const yb=y1&&o.coverage_status!=='unknown'?`<div class="bubble"><div class="who">Passage Rx</div>${fr?`Pour votre première année, avec les doses de départ, la projection selon les règles de votre régime est de ${money(y1.patient_pays)} au total. Ce n’est pas encore vérifié.`:`For your first year, including the starting doses, the projection from your plan’s rules is ${money(y1.patient_pays)} in total. This isn’t verified yet.`}</div>`:'';
 const pb=sp?`<div class="bubble"><div class="who">Passage Rx</div>${fr?`Votre ordonnance peut être exécutée à ${esc(sp.name)} (${esc(sp.area)}).`:`Your prescription can be filled at ${esc(sp.name)} (${esc(sp.area)}).`} ${t('delivery')}</div>`:`<div class="bubble"><div class="who">Passage Rx</div>${t('delivery')}</div>`;
 return`<h1>${fr?'Ce que le patient voit':'What the patient sees'}</h1><p class="sub">${fr?'Généré uniquement à partir du résultat structuré; aucun montant n’est calculé par l’IA.':'Generated only from the structured result; the AI computes no figures.'}</p>
 <div class="phone"><div class="bubble"><div class="who">Passage Rx · IA/AI</div>${t('ai')}</div><div class="bubble"><div class="who">Passage Rx</div>${msg}</div>${yb}${pb}
 <p class="hint">${t('src')}: ${o.source_authority==='live_pharmacy'?t('exact')+' · '+hm(lv.timestamp):RULES.version+' · '+RULES.as_of}. ${o.disclaimer}</p></div>`;}

function vPharm(){const rows=PATIENTS.filter(p=>st.live[p.id]).map(p=>{const l=st.live[p.id];return`<tr><td data-l="${t('s1')}">${p.name}</td><td data-l="${t('switch')}">${esc(l.sw)}</td><td data-l="${t('res')}">${l.result==='covered'?t('covered'):esc(codeText(l.code))}</td><td class="num" data-l="${t('planpays')}">${money(l.payer??null)}</td><td class="num" data-l="${t('pays')}">${money(l.patient??(l.projected?l.projected.pat:null))}</td></tr>`}).join('');
 return`<h1>${t('pharmacy')}</h1><p class="sub">${FR()?'Console de la pharmacie partenaire : demandes test et réponses d’adjudication.':'Partner pharmacy console: test claims and adjudication responses.'}</p>
 <div class="card"><label class="sw"><input type="checkbox" id="bill"${st.bill?' checked':''}><span><b>${t('bill')}</b><small>${t('bill_s')}</small></span></label></div>
 <div class="card"><h2>${t('queue')}</h2>${rows?`<div class="scroll"><table class="stack"><thead><tr><th>${t('s1')}</th><th>${t('switch')}</th><th>${t('res')}</th><th class="num">${t('planpays')}</th><th class="num">${t('pays')}</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="hint">${t('none2')}</p>`}</div>
 <div class="card"><h2>${t('network')}</h2><div class="scroll"><table class="stack"><thead><tr><th>${t('s4')}</th><th>FSA</th><th>${FR()?'Partenaire':'Partner'}</th><th>${t('f_cold')}</th></tr></thead><tbody>${PHARMS.map(p=>`<tr><td data-l="${t('s4')}">${esc(p.name)}<span class="why">${esc(p.area[I()])} · ${p.prov}</span></td><td data-l="FSA">${p.fsa}</td><td data-l="${FR()?'Partenaire':'Partner'}">${p.partner?'✓':'—'}</td><td data-l="${t('f_cold')}">${p.cold?'✓':'—'}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><h2>${t('codes')}</h2><table><tbody>${Object.keys(CODES).map(k=>`<tr><td><b>${k}</b></td><td>${CODES[k][I()]}</td></tr>`).join('')}<tr><td><b>${FR()?'autre':'other'}</b></td><td>${FR()?'Affiché tel quel avec « communiquez avec la pharmacie »':'Shown verbatim with “contact the pharmacy”'}</td></tr></tbody></table></div>`;}

function vAudit(){return`<h1>${t('audit')}</h1><div class="card">${st.audit.length?`<div class="scroll"><table class="stack"><thead><tr><th>${t('when')}</th><th>${t('who')}</th><th>${t('what')}</th><th>${t('path')}</th><th>${t('res')}</th><th>${t('ver')}</th></tr></thead><tbody>${st.audit.map(a=>`<tr><td data-l="${t('when')}" style="white-space:nowrap">${a.ts.slice(0,19).replace('T',' ')}</td><td data-l="${t('who')}">${esc(a.who)}</td><td data-l="${t('what')}">${esc(a.what)}</td><td data-l="${t('path')}">${a.path}</td><td data-l="${t('res')}">${esc(a.result)}</td><td data-l="${t('ver')}">${a.ver}</td></tr>`).join('')}</tbody></table></div>`:`<p class="hint">${t('none2')}</p>`}</div>`;}

const V={clinic:vClinic,patient:vPatient,pharmacy:vPharm,audit:vAudit};
function render(){document.documentElement.lang=L;document.getElementById('tag').textContent=t('tag');document.getElementById('demo').textContent=t('demo');document.getElementById('lang').textContent=FR()?'English':'Français';
 document.getElementById('tabs').innerHTML=Object.keys(V).map(k=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${st.tab===k}">${t(k)}</button>`).join('');
 document.getElementById('view').innerHTML=V[st.tab]();}
const rxChanged=()=>{if(st.res)st.stale=true;render();};

document.addEventListener('click',ev=>{const el=ev.target.closest('button');if(!el)return;
 if(el.dataset.t){st.tab=el.dataset.t;render();}
 else if(el.dataset.p){st.pid=el.dataset.p;st.res=null;st.stale=false;setRx(P());const s=st.srch[st.pid];st.pcIn=s&&s.fsa?s.fsa:'';render();}
 else if(el.dataset.area){if(st.area!==el.dataset.area){st.area=el.dataset.area;const k=Object.keys(IND).find(x=>IND[x][2]===st.area);st.ind=IND[P().dx][2]===st.area?P().dx:k;setMol(molsFor(st.ind)[0].id);st.scope=st.area==='derm'?'ind':'mol';rxChanged();}}
 else if(el.dataset.scope){st.scope=el.dataset.scope;render();}
 else if(el.dataset.ph){const ph=phById(el.dataset.ph);if(ph.prov!==P().prov)return;st.pharm[st.pid]=ph.id;log('Clinic staff',`Pharmacy selected: ${ph.name}`,'—',ph.partner?'Partner (live check)':'Not connected');if(st.res)st.stale=true;render();}
 else if(el.id==='find')search();
 else if(el.id==='lang'){L=FR()?'en':'fr';if(st.res)st.res.e=estimate(st.res.pt,st.res.cx,st.res.qty);render();}
 else if(el.id==='run')run();
 else if(el.id==='appr'){const cx=st.res.cx;P().plans.forEach(p=>{const v=cover(p,cx);if(v.auth&&!authOn(p,cx))(p.auth=p.auth||[]).push(cx.mol.id);});log('Pharmacy staff',`Authorization approval recorded (${cx.mol.inn}, demo)`,'B','Recorded');run();}
 else if(el.id==='wd'){const c=C();c.clinic=null;c.pharmacy=null;st.live[st.pid]=null;st.res=null;st.ytd[st.pid]=null;log('Patient','Consent withdrawn; coverage data deleted (except records required by law)','—','Deleted');render();}
 else if(el.id==='cp'){navigator.clipboard.writeText(document.getElementById('js').textContent).then(()=>{el.textContent=t('copied')}).catch(()=>{});}});
document.addEventListener('input',ev=>{if(ev.target.id==='pc')st.pcIn=ev.target.value;});
document.addEventListener('keydown',ev=>{if(ev.target.id==='pc'&&ev.key==='Enter'){ev.preventDefault();st.pcIn=ev.target.value;search();}});
document.addEventListener('change',ev=>{const el=ev.target,c=C(),y=Y();
 if(el.id==='ind'){st.ind=el.value;setMol(molsFor(st.ind)[0].id);rxChanged();}
 else if(el.id==='mol'){setMol(el.value);rxChanged();}
 else if(el.id==='prod'){st.prod=el.value;rxChanged();}
 else if(el.id==='qty'){st.qty=Math.max(1,Math.min(12,Math.round(+el.value)||1));if(st.res)st.stale=true;}
 else if(el.id==='days'){st.days=Math.max(1,Math.min(90,Math.round(+el.value)||28));if(st.res)st.stale=true;}
 else if(el.id==='rad'){st.rad=+el.value;if(st.srch[st.pid]&&st.srch[st.pid].fsa)search();}
 else if(el.id&&el.id.startsWith('f_')){st.flt[el.id.slice(2)]=el.checked;if(st.srch[st.pid]&&st.srch[st.pid].fsa){st.pcIn=st.srch[st.pid].fsa;search();}else render();}
 else if(['dedPaid','maxUsed','qcPaid','monthPaid'].includes(el.id))y[el.id]=el.value===''?'':String(Math.max(0,+el.value));
 else if(el.id==='c1'){c.clinic=el.checked?{ts:now(),ver:'1.1-demo',scope:'clinic_file:coverage_checks'}:null;if(!el.checked)c.pharmacy=null;log('Patient',el.checked?'Clinic-file consent granted (v1.1-demo)':'Clinic-file consent withdrawn','—','Recorded');render();}
 else if(el.id==='c2'){c.pharmacy=el.checked?{ts:now(),ver:'1.1-demo',scope:'pharmacy_referral:test_claim;no_retention'}:null;log('Patient',el.checked?'Pharmacy-referral consent granted (v1.1-demo)':'Pharmacy-referral consent withdrawn','—','Recorded');render();}
 else if(el.id==='bill'){st.bill=el.checked;log('Pharmacy staff',el.checked?'Billability confirmation marked on file':'Billability confirmation removed','B','Recorded','switch-demo 0.3');render();}});

/* Demo opens mid-use: Kevin (psoriasis), consents on, pharmacy found by postal code, Skyrizi checked */
setRx(P());
st.consent.p6={clinic:{ts:now(),ver:'1.1-demo',scope:'clinic_file:coverage_checks'},pharmacy:{ts:now(),ver:'1.1-demo',scope:'pharmacy_referral:test_claim;no_retention'}};
log('Patient','Clinic-file and pharmacy-referral consent granted (v1.1-demo)','—','Recorded');
st.pcIn='M5V';search();st.pharm.p6='ph1';log('Clinic staff','Pharmacy selected: Harbourline Specialty Pharmacy','—','Partner (live check)');
render();run();
}
</script>
